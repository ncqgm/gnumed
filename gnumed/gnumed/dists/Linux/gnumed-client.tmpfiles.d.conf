#====================================================
# GNUmed client tmpfiles handling
#
# license: GPL v2 or later
#
# drop this file into /usr/lib/tmpfiles.d/gnumed-client.conf
#
#====================================================
# remove files and directories under ~/.local/gnumed/logs/ if older than 2 weeks
R /home/*/.gnumed/logs/*/ - - - 14d -
# legacy:
R /home/*/.local/gnumed/logs/*/ - - - 14d -

# remove error_logs older than 2 weeks
R /home/*/.local/gnumed/error_logs - - - 14d -
# legacy:
R /home/*/.gnumed/error_logs - - - 14d -
